<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — UrbanRoots Homes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--amber:#C8690E;--amber-lt:#E8901A;--rust:#A63215;--cream:#FFFDF8;--cream-2:#FDF5E8;--bark:#3B1F08;--bark-2:#5C3210;--text:#2D1A08}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--cream-2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}

.login-wrap{width:100%;max-width:420px}
.back-link{display:inline-flex;align-items:center;gap:.4rem;color:var(--amber);text-decoration:none;font-size:.835rem;font-weight:500;margin-bottom:1.5rem;transition:.2s}
.back-link:hover{color:var(--rust)}

.login-card{background:#fff;border-radius:16px;padding:2.5rem;box-shadow:0 8px 40px rgba(59,31,8,.12);border:1px solid rgba(200,105,14,.12)}

.login-header{text-align:center;margin-bottom:2rem}
.login-emoji{font-size:2.5rem;margin-bottom:.6rem;display:block;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.login-title{font-family:'Times New Roman',Times,serif;font-size:1.9rem;font-weight:700;color:var(--bark)}
.login-sub{font-size:.825rem;color:#8B6040;margin-top:.25rem}

.form-group{margin-bottom:1.1rem}
.form-label{display:block;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#7A4A1E;margin-bottom:.4rem}
.input-wrap{position:relative}
.input-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:rgba(200,105,14,.5);font-size:.85rem;pointer-events:none}
.form-control{width:100%;padding:.65rem .85rem .65rem 2.4rem;border:1.5px solid rgba(200,105,14,.2);border-radius:8px;font-size:.9rem;color:var(--text);background:#fff;font-family:'Inter',sans-serif;transition:.2s}
.form-control:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(200,105,14,.1)}

.btn-login{width:100%;padding:.75rem;border-radius:8px;border:none;background:linear-gradient(135deg,var(--amber),var(--rust));color:#fff;font-size:.95rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:.5rem;transition:.2s;display:flex;align-items:center;justify-content:center;gap:.5rem}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(200,105,14,.4)}

.error-box{background:#FEF0EB;border:1px solid rgba(166,50,21,.25);border-radius:8px;padding:.7rem .9rem;display:flex;align-items:center;gap:.5rem;color:var(--rust);font-size:.855rem;margin-bottom:1.1rem}

.login-footer{margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid rgba(200,105,14,.1);text-align:center}
.login-footer p{font-size:.78rem;color:#8B6040;margin-bottom:.75rem}
.role-chips{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap}
.chip{padding:.2rem .65rem;border-radius:20px;font-size:.72rem;font-weight:600}
.chip-admin{background:rgba(166,50,21,.1);color:var(--rust);border:1px solid rgba(166,50,21,.2)}
.chip-manager{background:rgba(196,149,42,.12);color:#7A5C00;border:1px solid rgba(196,149,42,.2)}
.chip-agent{background:rgba(107,140,90,.12);color:#2E6B20;border:1px solid rgba(107,140,90,.2)}
</style>
</head>
<body>
<div class="login-wrap">
  <a href="{% url 'landing' %}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
  <div class="login-card">
    <div class="login-header">
      <span class="login-emoji">🍂</span>
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-sub">Sign in to your UrbanRoots Homes account</p>
    </div>

    {% if error %}
    <div class="error-box"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <i class="fas fa-user input-icon"></i>
          <input type="text" name="username" class="form-control" placeholder="Your username" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" name="password" class="form-control" placeholder="Your password" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Sign In</button>
    </form>

    <div class="login-footer">
      <p>Portal access levels</p>
      <div class="role-chips">
        <span class="chip chip-admin"><i class="fas fa-crown"></i> Administrator</span>
        <span class="chip chip-manager"><i class="fas fa-building"></i> Manager</span>
        <span class="chip chip-agent"><i class="fas fa-user-tie"></i> Agent</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
