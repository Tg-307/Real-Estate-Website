{% extends 'realestate/base.html' %}
{% block title %}Add Customer{% endblock %}
{% block nav_addcust %}active{% endblock %}
{% block topbar_title %}Add Customer{% endblock %}
{% block content %}
<div class="card" style="max-width:800px">
  <div class="card-header"><h3><i class="fas fa-address-card"></i> Customer Details</h3></div>
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <div class="form-grid">
        <div class="form-group"><label class="form-label required">First Name</label><input type="text" name="first_name" class="form-control" required></div>
        <div class="form-group"><label class="form-label required">Last Name</label><input type="text" name="last_name" class="form-control" required></div>
        <div class="form-group"><label class="form-label required">Phone</label><input type="text" name="phone" class="form-control" required maxlength="20"></div>
        <div class="form-group"><label class="form-label">Alternate Phone</label><input type="text" name="alternate_phone" class="form-control" maxlength="20"></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
        <div class="form-group"><label class="form-label required">Aadhar Number</label><input type="text" name="aadhar_no" class="form-control" required maxlength="12" minlength="12" pattern="[0-9]{12}"></div>
        <div class="form-group"><label class="form-label required">Role Type</label><select name="role_type" class="form-control form-select" required><option value="buyer">Buyer</option><option value="seller">Seller</option><option value="both">Both</option></select></div>
        <div class="form-group"><label class="form-label">City</label><input type="text" name="city" class="form-control"></div>
        <div class="form-group"><label class="form-label">State</label><input type="text" name="state" class="form-control" value="Assam"></div>
        <div class="form-group"><label class="form-label">Pincode</label><input type="text" name="pincode" class="form-control" maxlength="10"></div>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:1.25rem">
        <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Customer</button>
        <a href="{% url 'agent_dashboard' %}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
